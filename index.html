<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Emil Tornøe Jacobsen</title>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f7fa;
  color: #333;
}

/* HEADER */
header {
  background: #23356E;
  color: white;
  padding: 80px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.9;
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

/* SECTIONS */
section {
  margin-bottom: 50px;
}

h2 {
  color: #23356E;
  border-bottom: 2px solid #23356E;
  padding-bottom: 5px;
  margin-bottom: 20px;
}

/* JOB */
.job {
  margin-bottom: 25px;
}

.job b {
  display: block;
}

/* LISTS */
ul {
  padding-left: 20px;
}

/* GRID (til kompetencer) */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

</style>

</head>

<body>

<header>
  <h1>Emil Tornøe Jacobsen</h1>
  <p>Economic Analysis Consultant</p>
</header>

<div class="container">

<section>
  <h2>Motivation</h2>
  <div class="card">
    <p>DIN TEKST HER</p>
  </div>
</section>

<section>
  <h2>Experience</h2>

  <div class="job card">
    <b>Jobtitel | Virksomhed</b>
    <span>Dato</span>
    <ul>
      <li>Beskrivelse</li>
    </ul>
  </div>

</section>

<section class="grid">

  <div>
    <h2>Core Competencies</h2>
    <div class="card">
      <ul>
        <li>...</li>
      </ul>
    </div>
  </div>

  <div>
    <h2>IT Skills</h2>
    <div class="card">
      <ul>
        <li>...</li>
      </ul>
    </div>
  </div>

</section>

<section>
  <h2>Education</h2>
  <div class="card">
    <p>...</p>
  </div>
</section>

<section>
  <h2>Contact</h2>
  <div class="card">
    <p>Email: ...</p>
    <p>LinkedIn: ...</p>
  </div>
</section>

</div>

</body>
</html>
